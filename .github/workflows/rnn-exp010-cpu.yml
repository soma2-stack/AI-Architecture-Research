name: RNN Experiment 010 — multi-slot capacity screen

on:
  push:
    branches:
      - prototype/rnn-llm-architecture-v0-20261007
    paths:
      - 'prototypes/rnn_llm_architecture/capacity_010.py'
      - 'prototypes/rnn_llm_architecture/test_capacity_010.py'
      - '.github/workflows/rnn-exp010-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnn-exp010-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        task: ['2x2', '4x2', '8x2', '4x4', '8x4']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
            filelock typing-extensions setuptools sympy networkx jinja2 fsspec
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps 'torch==2.14.1+cpu'
          python -c 'import torch; assert torch.version.cuda is None and not torch.cuda.is_available(); print(torch.__version__)'
      - name: Full architecture and Experiment 010 test suite
        run: python -m pytest -q -o addopts= -p no:cacheprovider prototypes/rnn_llm_architecture/
      - name: Fixed-budget capacity screen (sequential runs; bounded)
        shell: bash
        run: |
          python -m prototypes.rnn_llm_architecture.capacity_010 \
            --output "${RUNNER_TEMP}/rnn-exp010-${{ matrix.task }}.json" \
            --tasks '${{ matrix.task }}' \
            --variants protected,protected_no_retain,gru24,delta_rule \
            --seeds 17,29,43 --steps 800 --batch 12 --eval-batch 128 \
            --delay 64 --eval-delays 64,256 --max-wall-seconds 1050
      - name: Preserve exact tested source
        if: always()
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/rnn-exp010-source-${{ matrix.task }}.tar.gz" \
            AGENTS.md .github/workflows/rnn-exp010-cpu.yml prototypes/rnn_llm_architecture
      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnn-exp010-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/rnn-exp010-${{ matrix.task }}.json
            ${{ runner.temp }}/rnn-exp010-source-${{ matrix.task }}.tar.gz
          if-no-files-found: warn
