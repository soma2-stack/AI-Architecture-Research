name: Experiment 010 — missing GRU-32 arm (CPU-only)

on:
  push:
    branches:
      - codex/exp010-gru32-run-20261022
    paths:
      - '.github/workflows/rnn-exp010-gru32-cpu.yml'

permissions:
  contents: read

concurrency:
  group: rnn-exp010-gru32-20261022
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        task: ['2x2', '4x2', '8x2', '4x4', '8x4']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact source and run commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
            filelock typing-extensions setuptools sympy networkx jinja2 fsspec
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps 'torch==2.14.1+cpu'
          python -c 'import sys, torch; assert sys.version_info[:2] == (3, 12); assert torch.version.cuda is None and not torch.cuda.is_available(); print(sys.version); print(torch.__version__)'
      - name: Full architecture and Experiment 010 test suite
        run: python -m pytest -q -o addopts= -p no:cacheprovider prototypes/rnn_llm_architecture/
      - name: Fixed-budget GRU-32 arm (three seeds; 800 updates)
        shell: bash
        run: |
          python -m prototypes.rnn_llm_architecture.capacity_010 \
            --output "${RUNNER_TEMP}/rnn-exp010-gru32-${{ matrix.task }}.json" \
            --tasks '${{ matrix.task }}' \
            --variants gru32 \
            --seeds 17,29,43 --steps 800 --batch 12 --eval-batch 128 \
            --delay 64 --eval-delays 64,256 --max-wall-seconds 1050
      - name: Preserve exact tested source
        if: always()
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/rnn-exp010-gru32-source-${{ matrix.task }}.tar.gz" \
            AGENTS.md .github/workflows/rnn-exp010-gru32-cpu.yml prototypes/rnn_llm_architecture
      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnn-exp010-gru32-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/rnn-exp010-gru32-${{ matrix.task }}.json
            ${{ runner.temp }}/rnn-exp010-gru32-source-${{ matrix.task }}.tar.gz
          if-no-files-found: warn