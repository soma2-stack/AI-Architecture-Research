name: RNN Experiment 001 — bounded CPU checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnn-exp001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-memory-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
            filelock typing-extensions setuptools sympy networkx jinja2 fsspec
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps 'torch==2.14.1+cpu'
          python -c 'import torch; assert torch.version.cuda is None and not torch.cuda.is_available(); print(torch.__version__)'
      - name: Architecture and new pilot unit tests
        run: python -m pytest -o addopts= -q -p no:cacheprovider prototypes/rnn_llm_architecture/
      - name: Bounded five-model smoke training
        run: |
          python -m prototypes.rnn_llm_architecture.learning_pilot \
            --output "${RUNNER_TEMP}/rnn-exp001-smoke.json" \
            --models tanh,near_critical,protected,gru,lstm \
            --tasks delayed,selective \
            --delays 16 --seeds 17 \
            --steps 12 --batch 8 --eval-batch 128 \
            --max-wall-seconds 720
      - name: Bounded five-model full matrix (100 updates per condition)
        run: |
          python -m prototypes.rnn_llm_architecture.learning_pilot \
            --output "${RUNNER_TEMP}/rnn-exp001-matrix.json" \
            --models tanh,near_critical,protected,gru,lstm \
            --tasks delayed,selective \
            --delays 16,64 --seeds 17,29 \
            --steps 100 --batch 16 --eval-batch 512 \
            --max-wall-seconds 600
      - name: Package architecture source for independent offline verification
        if: always()
        run: |
          tar -czf "${RUNNER_TEMP}/rnn-architecture-source.tar.gz" \
            AGENTS.md prototypes/rnn_llm_architecture
      - name: Upload test evidence and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnn-exp001-evidence
          path: |
            ${{ runner.temp }}/rnn-exp001-smoke.json
            ${{ runner.temp }}/rnn-exp001-matrix.json
            ${{ runner.temp }}/rnn-architecture-source.tar.gz
          if-no-files-found: warn
