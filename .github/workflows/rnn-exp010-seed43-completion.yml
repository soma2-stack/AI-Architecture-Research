name: Exp010 seed43 completion only

on:
  push:
    branches: [codex/complete-exp010-seed43-20261022]
    paths: [.github/workflows/rnn-exp010-seed43-completion.yml]

permissions:
  contents: read

jobs:
  complete-original-condition:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: completion
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: eb71064db54285d5b4d0007413b6769aadba24f1
          path: original-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Match original CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 scipy==1.17.1 pytest==9.1.1 \
            filelock typing-extensions setuptools sympy networkx jinja2 fsspec
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps 'torch==2.14.1+cpu'
      - name: Replay and verify only the unfinished condition
        run: >-
          python completion/experiments/completions/experiment_010_seed43_20261022/run_completion.py
          --source-root original-source
          --output-dir "${{ runner.temp }}/exp010-seed43-output"
      - name: Preserve completion evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp010-seed43-completion
          path: ${{ runner.temp }}/exp010-seed43-output/
          if-no-files-found: warn
